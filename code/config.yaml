# Phase-1 best-of-N verifier diagnostic — zeroshot arm, EgoSchema-subset.
model:
  hf_id: "Qwen/Qwen3.5-27B"
  tp_size: 1
  dtype: "bfloat16"
  max_model_len: 32768
  gpu_memory_utilization: 0.85
  thinking_mode: false

inference:
  method: "best_of_n"
  base_method: "zeroshot_cot"
  n_trajectories: 8
  n_frames: 32
  max_new_tokens: 1024
  temperature: 0.8
  top_p: 1.0
  seed: 42
  batch_size: 32

video:
  cache_root: "data/video_cache"   # or override on the CLI: video.cache_root=$VRITS_DATA/video_cache
  frame_extractor: "decord"
  frame_resize: 336

benchmarks:
  - name: "egoschema"
    n_samples: null
    subset: "subset"

output:
  results_dir: "../"
  save_predictions: true
  progress_log_every: 25
